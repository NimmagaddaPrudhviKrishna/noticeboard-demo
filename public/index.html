<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>College Notice Board</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="icon">📌</span>
    <div>
      <h1>College Notice Board</h1>
      <p>Announcement System</p>
    </div>
  </div>
  <nav>
    <a href="#" id="navBoard">Notice Board</a>
    <a href="#" id="navAdmin">Admin Login</a>
    <button class="link" id="logoutBtn" style="display:none;">Logout</button>
  </nav>
</header>

<main>

  <!-- ============ PUBLIC BOARD VIEW ============ -->
  <section id="view-board">
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search notices..." />
      <select id="categoryFilter">
        <option value="All">All Categories</option>
        <option value="General">General</option>
        <option value="Academic">Academic</option>
        <option value="Exam">Exam</option>
        <option value="Event">Event</option>
        <option value="Placement">Placement</option>
        <option value="Holiday">Holiday</option>
      </select>
      <select id="priorityFilter">
        <option value="All">All</option>
        <option value="urgent">Urgent Only</option>
        <option value="normal">Normal Only</option>
      </select>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>

    <div id="noticeList" class="notice-list">
      <p class="empty-state">Loading notices...</p>
    </div>
  </section>

  <!-- ============ LOGIN VIEW ============ -->
  <section id="view-login" style="display:none;">
    <div class="login-wrap">
      <h2>Admin Login</h2>
      <div id="loginAlert"></div>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="admin" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>
      <button class="btn" id="loginBtn">Login</button>
      <p class="hint">Default demo credentials — Username: <b>admin</b> &nbsp; Password: <b>admin123</b></p>
    </div>
  </section>

  <!-- ============ ADMIN DASHBOARD VIEW ============ -->
  <section id="view-admin" style="display:none;">
    <div class="form-panel">
      <h2 id="formTitle">Post a New Notice</h2>
      <div id="formAlert"></div>
      <input type="hidden" id="editId" />
      <div class="form-grid">
        <div class="full">
          <label>Title</label>
          <input type="text" id="title" placeholder="e.g. Semester Exam Timetable Released" />
        </div>
        <div class="full">
          <label>Content</label>
          <textarea id="content" placeholder="Write the full announcement here..."></textarea>
        </div>
        <div>
          <label>Category</label>
          <select id="category">
            <option value="General">General</option>
            <option value="Academic">Academic</option>
            <option value="Exam">Exam</option>
            <option value="Event">Event</option>
            <option value="Placement">Placement</option>
            <option value="Holiday">Holiday</option>
          </select>
        </div>
        <div>
          <label>Priority</label>
          <select id="priority">
            <option value="normal">Normal</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
      </div>
      <br />
      <button class="btn accent" id="submitBtn">Post Notice</button>
      <button class="btn ghost" id="cancelEditBtn" style="display:none;">Cancel Edit</button>
    </div>

    <h2>All Notices</h2>
    <div id="adminNoticeList" class="notice-list">
      <p class="empty-state">Loading...</p>
    </div>
  </section>

</main>

<footer>College Notice Board Announcement System &mdash; Minor Project</footer>

<script src="js/app.js"></script>
</body>
</html>
